// Global Gradle init script — adds Aliyun Maven mirror to ALL projects
// so Maven Central 403s don't break the build in this environment.
allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
