name: Android APK

on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "tag=main-${{ github.run_id }}" >> $GITHUB_OUTPUT
          else
            # For workflow_dispatch, create a manual version using run ID to avoid collisions
            echo "tag=manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## NikG6 Photo Editor - Release ${{ steps.tag.outputs.tag }}

            ### Features
            - AI Assistant with OpenRouter (hardcoded API key, no setup needed)
            - Default model: `google/gemini-2.0-flash-exp:free` (vision-capable)
            - 8 prompt presets for quick edits
            - Full photo editing: adjustments, filters, crop, rotate, flip, resize, export
            - Undo/redo with snapshot-based history
            - Vision support (assistant sees the photo)

            ### Install
            1. Download `app-debug.apk` below
            2. Enable "Install unknown apps" on your Android device
            3. Tap the APK to install

            **Updating an existing install:** just install the new APK over the old one —
            Android will replace the app in place, no need to uninstall first.
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
