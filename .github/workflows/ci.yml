name: CI

on:
  push:
    branches: [kilo/live-copper-nwe]
  pull_request:
    branches: [kilo/live-copper-nwe]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate sample image
        run: npm run gen:sample

      - name: Install Playwright browsers
        uses: microsoft/playwright-github-action@v1
        with:
          with-deps: true

      - name: E2E tests
        run: npm run e2e

      - name: Build
        run: npm run build
